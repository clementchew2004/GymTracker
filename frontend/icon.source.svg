<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0a0a0a"/>
  <!-- Ascending bars: progressive overload, and a nod to the volume chart.
       Kept inside the central 60% so maskable crops don't clip it. -->
  <g fill="#3b82f6">
    <rect x="140" y="300" width="56" height="72"  rx="8"/>
    <rect x="228" y="248" width="56" height="124" rx="8"/>
    <rect x="316" y="180" width="56" height="192" rx="8"/>
  </g>
  <!-- Barbell across the bars -->
  <g fill="#e5e5e5">
    <rect x="124" y="148" width="264" height="16" rx="8"/>
    <rect x="104" y="128" width="20" height="56" rx="6"/>
    <rect x="388" y="128" width="20" height="56" rx="6"/>
  </g>
</svg>
